[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-cleanup-demo"
version = "0.1.0"
description = "Clean messy CSVs: encoding, duplicates, emails, phones, and a JSON quality report."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AQA / data cleanup demo" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
csv-cleanup = "csv_cleanup.cli:main"

[tool.setuptools.packages.find]
include = ["csv_cleanup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
